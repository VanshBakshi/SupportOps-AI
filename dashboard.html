<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportOps AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:#0b1020;color:#e8edf7}header{padding:24px 5%;border-bottom:1px solid #202943;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:26px}small{color:#91a0bb}.wrap{width:90%;max-width:1400px;margin:28px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#11182b;border:1px solid #25304b;border-radius:16px;padding:20px;box-shadow:0 8px 30px #0003}.metric{font-size:32px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}input,select,button{background:#0d1425;color:#fff;border:1px solid #2b3856;border-radius:10px;padding:11px 13px}button{cursor:pointer;background:#3456d1;border:0}.table{overflow:auto}.row{display:grid;grid-template-columns:1.5fr .8fr .8fr 1fr 1fr;gap:12px;padding:15px;border-bottom:1px solid #202943;align-items:center}.head{color:#91a0bb;font-size:12px;text-transform:uppercase}.badge{padding:5px 9px;border-radius:20px;background:#263354;display:inline-block;font-size:12px}.risk{font-weight:700}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center}.modal .card{width:min(700px,92vw);max-height:85vh;overflow:auto}.close{float:right}.section{margin-top:24px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.head{display:none}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head>
<body><header><div><h1>SupportOps AI</h1><small>AI ticket operations & SLA intelligence</small></div><button onclick="loadAll()">Refresh</button></header>
<div class="wrap"><div class="grid" id="metrics"></div><div class="toolbar"><input id="search" placeholder="Search tickets..." oninput="loadTickets()"><select id="priority" onchange="loadTickets()"><option value="">All priorities</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select><button onclick="createDemo()">Create Demo Ticket</button></div>
<div class="card"><div class="table"><div class="row head"><div>Ticket</div><div>Priority</div><div>Category</div><div>Sentiment</div><div>SLA Risk</div></div><div id="tickets"></div></div></div>
<div class="section card"><h2>Operations Analytics</h2><pre id="analytics">Loading...</pre></div></div>
<div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()">Close</button><div id="detail"></div></div></div>
<script>
const api='/api/v1'; const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function json(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function loadAll(){await Promise.all([loadStats(),loadTickets(),loadAnalytics()])}
async function loadStats(){const x=await json(api+'/tickets/stats/summary');document.getElementById('metrics').innerHTML=[['Total',x.total],['Open',x.open],['Critical',x.critical],['SLA At Risk',x.sla_at_risk]].map(a=>`<div class="card"><small>${a[0]}</small><div class="metric">${a[1]}</div></div>`).join('')}
async function loadTickets(){const p=document.getElementById('priority').value,s=document.getElementById('search').value;const q=new URLSearchParams();if(p)q.set('priority',p);if(s)q.set('search',s);const data=await json(api+'/tickets?'+q);document.getElementById('tickets').innerHTML=data.map(t=>`<div class="row" onclick="showTicket('${t.id}')"><div><b>${esc(t.subject)}</b><br><small>${esc(t.customer_name)}</small></div><div><span class="badge">${esc(t.priority)}</span></div><div>${esc(t.category)}<br><small>${esc(t.subcategory)}</small></div><div>${esc(t.sentiment)}</div><div class="risk">${Math.round(t.sla_risk*100)}%</div></div>`).join('')||'<div class="row">No tickets found.</div>'}
async function loadAnalytics(){const x=await json(api+'/analytics/overview');document.getElementById('analytics').textContent=JSON.stringify(x,null,2)}
async function showTicket(id){const t=await json(api+'/tickets/'+id);document.getElementById('detail').innerHTML=`<h2>${esc(t.subject)}</h2><p>${esc(t.description)}</p><hr><p><b>Category:</b> ${esc(t.category)} / ${esc(t.subcategory)}</p><p><b>Priority:</b> ${esc(t.priority)} &nbsp; <b>Sentiment:</b> ${esc(t.sentiment)}</p><p><b>SLA risk:</b> ${Math.round(t.sla_risk*100)}%</p><h3>AI Summary</h3><p>${esc(t.ai_summary)}</p><h3>Recommended Action</h3><p>${esc(t.recommended_action)}</p>`;document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
async function createDemo(){await json(api+'/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_name:'Demo Customer',subject:'Production API is failing with timeout errors',description:'Our production API is timing out for multiple users. This is urgent and blocking business operations.',source:'web',auto_analyze:true})});loadAll()}
loadAll();
</script></body></html>
